name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, torch ${{ matrix.torch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            torch: "2.10.0"
          - os: ubuntu-latest
            python: "3.11"
            torch: "2.10.0"
          - os: ubuntu-latest
            python: "3.12"
            torch: "2.10.0"
          - os: ubuntu-latest
            python: "3.13"
            torch: "2.10.0"
          - os: ubuntu-latest
            python: "3.14"
            torch: "2.15.0"
          - os: windows-latest
            python: "3.12"
            torch: "2.10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install PyTorch CPU
        run: python -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run CPU tests
        run: pytest -m "not cuda"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
